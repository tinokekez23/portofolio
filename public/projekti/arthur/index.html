<!DOCTYPE html>
<html lang="hr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arthur protiv goblina, igra · Tino Kekez</title>
  <meta name="description" content="2D platformska igra u JavaScriptu iz kolegija Objektno orijentirano programiranje. Igra se u pregledniku na računalu.">
  <link rel="canonical" href="https://tinokekez.vercel.app/projekti/arthur/">
  <link href="otter.css" rel="stylesheet" type="text/css">
  <link type="image/png" sizes="16x16" rel="icon" href="otter/ottericon2.png">
</head>

<body>

  <main>
  <h1 class="sr">Arthur protiv goblina</h1>
  <div id="divIzbornik">
    <p class="upute"><a href="/#projekti">Natrag na portfolio</a> Klikni Setup game pa START. Strelice: kretanje i skok, razmaknica: udarac.</p>
    <button type="button" id="btnMaps"><span class="emoji" aria-hidden="true">&#127757;</span> Maps</button>

    <button type="button" class="orange" id="btnSetupGame"><span class="emoji" aria-hidden="true">&#128736;</span> Setup game #</button>

    <button type="button" class="green" id="btnStart"><span class="emoji" aria-hidden="true">&#127937;</span> START</button>
    <button type="button" class="red" id="btnStop"><span class="emoji" aria-hidden="true">&#10060;</span> STOP</button>

  </div>

  <canvas id="game"></canvas>

  <!-- Info -->
  <div class="infowrapper">
    <p class="info"><label><input type="checkbox" name="showOutput" id="showOutput"> Output info</label></p>
    <textarea id="taInfo" class="info" rows="4" disabled hidden aria-label="Output info"></textarea>
  </div>
  </main>

  <!-- postavke -->

  <script src="otter/lib-00-GameSettings.js"></script>

  <!-- mape -->

  <script src="maps/v10/level1.js"></script>
  <script src="maps/v10/level2.js"></script>

  <!-- okvir -->

  <script src="otter/lib-01-tiled.js"></script>
  <script src="otter/lib-02-sensing.js"></script>
  <script src="otter/lib-03-display.js"></script>
  <script src="otter/lib-04-engine.js"></script>
  <script src="otter/lib-05-game.js"></script>
  <script src="otter/lib-06-main.js"></script>

  <!-- vlastiti kod -->
  <script src="jsKod/kod_00-staticka.js"></script>
  <script src="jsKod/kod_01-likovi.js"></script>
  <script src="jsKod/kod_02-postavke.js"></script>
  <script src="jsKod/kod_03-logikaIgre.js"></script>

</body>

</html>
